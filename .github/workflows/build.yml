name: Build OpenHantek Windows

on:
  push:
    branches: [ main, principal, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_PREFIX_PATH="%Qt5_DIR%" -DENABLE_DOC=OFF -DCPACK_CONFIG_FILE="" ..

    - name: Build Project
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: OpenHantek-Automotivo-Win64
        path: build/Release/
